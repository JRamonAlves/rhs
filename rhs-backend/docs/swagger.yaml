info:
  contact: {}
  description: This is the RHS Backend API documentation.
  title: RHS Backend API
  version: "1.0"
paths:
  /api/v1/hello:
    get:
      description: Returns a greeting from the server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Show a hello message
      tags:
      - example
  /countServices:
    get:
      description: Returns the number of services stored at the path configured by
        SERVICE_PATH.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
        "500":
          description: Service configuration could not be loaded
      summary: Count configured services
      tags:
      - services
  /getServices:
    get:
      description: Returns the JSON document stored at the path configured by SERVICE_PATH.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Service configuration could not be loaded
      summary: Get service configuration
      tags:
      - services
  /getValues:
    get:
      description: Returns the value stored under the supplied Redis key.
      parameters:
      - description: Redis key
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: Key is required
      summary: Get a Redis value
      tags:
      - redis
  /ping:
    get:
      description: Returns a pong response when the API is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API health
      tags:
      - health
  /setValues:
    post:
      description: Stores a value under the supplied Redis key without expiration.
      parameters:
      - description: Redis key
        in: query
        name: key
        required: true
        type: string
      - description: Value to store
        in: query
        name: value
        required: true
        type: string
      responses:
        "200":
          description: Value stored
        "406":
          description: Key and value are required
        "500":
          description: Redis operation failed
      summary: Set a Redis value
      tags:
      - redis
swagger: "2.0"
